
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie - Food Delivery App</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#fff8f1;color:#292929}
header{background:#ff5722;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
header a{color:white;text-decoration:none;font-weight:bold}
.hero{text-align:center;padding:35px 15px;background:#ffecdf}
.hero h2{font-size:30px;margin-bottom:8px}
main{width:90%;max-width:1100px;margin:auto}
h2.section-title{margin:25px 0 15px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px}
.food-card,.panel{background:white;padding:18px;border-radius:12px;box-shadow:0 3px 12px #00000012}
.food-card img{width:100%;height:160px;object-fit:cover;border-radius:8px}
.food-card h3{margin:8px 0}
.price{color:#e64a19;font-weight:bold}
button{background:#ff5722;color:white;border:none;padding:10px 13px;border-radius:7px;cursor:pointer}
button:hover{background:#e64a19}
.add-btn,.checkout-btn{width:100%;margin-top:12px}
.panel{margin:25px 0}
.panel h2{margin-bottom:12px}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.cart-row button{padding:5px 10px}
.bill-row{display:flex;justify-content:space-between;margin-top:10px}
.total{border-top:1px solid #ddd;padding-top:12px;font-size:20px;font-weight:bold}
input,textarea,select{display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:7px;font:inherit}
.status{background:#eee;padding:12px;margin:8px 0;border-radius:7px}
.status.active{background:#dff5e5;color:#176b35;font-weight:bold}
footer{text-align:center;background:#292929;color:white;padding:20px;margin-top:30px}
@media(max-width:500px){.hero h2{font-size:23px}header h1{font-size:23px}}
</style>
</head>

<body>
<header>
  <h1>🍔 Foodie</h1>
  <a href="#cart">🛒 Cart (<span id="count">0</span>)</a>
</header>

<section class="hero">
  <h2>Delicious Food, Delivered Fast!</h2>
  <p>Choose your favourite food and order online.</p>
</section>

<main>
  <h2 class="section-title">🍕 Our Food Menu</h2>
  <div class="menu" id="menu"></div>

  <section class="panel" id="cart">
    <h2>🛒 Your Cart</h2>
    <div id="cart-items">Your cart is empty.</div>
    <div class="bill-row"><span>Subtotal</span><span>₹<span id="subtotal">0</span></span></div>
    <div class="bill-row"><span>Delivery Charge</span><span>₹<span id="delivery">0</span></span></div>
    <div class="bill-row total"><span>Grand Total</span><span>₹<span id="total">0</span></span></div>
  </section>

  <section class="panel">
    <h2>📋 Checkout</h2>
    <form id="order-form">
      <input id="name" placeholder="Your full name" required>
      <input id="phone" type="tel" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required>
      <textarea id="address" placeholder="Delivery address" required></textarea>
      <label for="payment">Payment Method</label>
      <select id="payment">
        <option>Cash on Delivery</option>
        <option>Demo Online Payment</option>
      </select>
      <button class="checkout-btn" type="submit">Place Order</button>
    </form>
  </section>

  <section class="panel" id="tracking" hidden>
    <h2>📦 Track Your Order</h2>
    <p id="order-id"></p>
    <div id="statuses"></div>
    <p id="track-message"></p>
  </section>
</main>

<footer>Foodie | Food Delivery Internship Project</footer>

<script>
const foods=[
 {id:1,name:"Veg Burger",price:99,image:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"},
 {id:2,name:"Pizza",price:199,image:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500"},
 {id:3,name:"French Fries",price:79,image:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500"},
 {id:4,name:"Pasta",price:149,image:"https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=500"},
 {id:5,name:"Sandwich",price:89,image:"https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=500"},
 {id:6,name:"Chocolate Cake",price:119,image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500"}
];

let cart=[];

foods.forEach(food=>{
 const card=document.createElement("div");
 card.className="food-card";

 const img=document.createElement("img");
 img.src=food.image;
 img.alt=food.name;
 img.onerror=()=>{img.style.display="none"};

 const title=document.createElement("h3");
 title.textContent=food.name;

 const price=document.createElement("p");
 price.className="price";
 price.textContent="₹"+food.price;

 const btn=document.createElement("button");
 btn.className="add-btn";
 btn.textContent="Add to Cart";
 btn.onclick=()=>addToCart(food.id);

 card.append(img,title,price,btn);
 document.getElementById("menu").appendChild(card);
});

function addToCart(id){
 const item=cart.find(x=>x.id===id);
 if(item)item.quantity++;
 else{
  const food=foods.find(x=>x.id===id);
  cart.push({...food,quantity:1});
 }
 renderCart();
}

function changeQuantity(id,amount){
 const item=cart.find(x=>x.id===id);
 if(!item)return;
 item.quantity+=amount;
 if(item.quantity<=0)cart=cart.filter(x=>x.id!==id);
 renderCart();
}

function renderCart(){
 const container=document.getElementById("cart-items");
 container.replaceChildren();

 if(cart.length===0)container.textContent="Your cart is empty.";

 cart.forEach(item=>{
  const row=document.createElement("div");
  row.className="cart-row";

  const details=document.createElement("span");
  details.textContent=`${item.name} × ${item.quantity} = ₹${item.price*item.quantity}`;

  const controls=document.createElement("span");
  const minus=document.createElement("button");
  minus.textContent="−";
  minus.onclick=()=>changeQuantity(item.id,-1);

  const plus=document.createElement("button");
  plus.textContent="+";
  plus.onclick=()=>changeQuantity(item.id,1);

  controls.append(minus,document.createTextNode(" "),plus);
  row.append(details,controls);
  container.appendChild(row);
 });

 const subtotal=cart.reduce((sum,x)=>sum+x.price*x.quantity,0);
 const delivery=subtotal>0?30:0;

 document.getElementById("subtotal").textContent=subtotal;
 document.getElementById("delivery").textContent=delivery;
 document.getElementById("total").textContent=subtotal+delivery;
 document.getElementById("count").textContent=cart.reduce((sum,x)=>sum+x.quantity,0);
}

document.getElementById("order-form").addEventListener("submit",function(e){
 e.preventDefault();

 if(cart.length===0){
  alert("Please add food to your cart first!");
  return;
 }

 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const address=document.getElementById("address").value.trim();

 if(!name||!address||!/^[0-9]{10}$/.test(phone)){
  alert("Please enter valid details.");
  return;
 }

 const orderId="FD"+Date.now().toString().slice(-8);
 const total=document.getElementById("total").textContent;

 document.getElementById("tracking").hidden=false;
 document.getElementById("order-id").textContent=`Order ID: ${orderId} | Total: ₹${total}`;

 const statuses=[
  "1. Order Placed",
  "2. Food is Being Prepared",
  "3. Out for Delivery",
  "4. Order Delivered"
 ];

 const box=document.getElementById("statuses");
 box.replaceChildren();

 statuses.forEach((status,index)=>{
  const div=document.createElement("div");
  div.className="status"+(index===0?" active":"");
  div.textContent=status;
  box.appendChild(div);
 });

 document.getElementById("track-message").textContent=
  `Thank you, ${name}! Your demo order has been placed. Payment: ${document.getElementById("payment").value}.`;

 document.getElementById("tracking").scrollIntoView({behavior:"smooth"});

 cart=[];
 renderCart();
 this.reset();
});

renderCart();
</script>
</body>
</html>
